[project]
name = "eps-cnc-cutplan"
version = "0.1.0"
description = "EPS/isopor CNC cut package generator with YAML contracts, DXF exports, and production gates."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.0",
  "ezdxf>=1.4",
  "numpy>=1.26,<3",
  "shapely>=2.0,<3",
  "trimesh>=4.5,<5",
  "mapbox-earcut>=1.0,<3",
  "Pillow>=10.4,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
