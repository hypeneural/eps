name: Portal browser
on:
  pull_request:
    paths:
      - 'portal/**'
      - '.agents/**'
      - 'AGENTS.md'
      - 'requirements.txt'
      - 'src/epscad/**'
      - 'src/epscad/publishing/**'
      - 'scripts/**'
      - '.github/workflows/portal-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt "playwright>=1.49,<2"
      - run: python scripts/agent_preflight.py
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/gallery_demo.py --output outputs/browser_demo
      - run: python scripts/check_gallery_browser.py --site outputs/browser_demo/site --screenshots outputs/browser_shots
      - run: python scripts/check_tap_browser_fixture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-browser-screenshots
          path: outputs/browser_shots
