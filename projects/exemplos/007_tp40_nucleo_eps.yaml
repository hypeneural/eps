project:
  id: 007_tp40_nucleo_eps
  name: Miolo EPS telha TP40 trapezoidal - medidas NOMINAIS (draft)
  unit: mm
  status: draft
  source:
    kind: manual_text
    scale_confirmed: false
    dimensions_confirmed: false
    production_confirmed: false

machine:
  profile: scara_hotwire_eps
  process_type: hotwire_2d
  output_format: dxf_r12
  cam_bridge: LazyCam
  controller_hint: Mach3_EPS

# Bloco EPS: topo do miolo = topo do bloco (y = height_y).
# thickness_z = comprimento percorrido pelo fio (extrusao do perfil). Valor nominal.
material:
  type: EPS
  density: P3
  stock:
    length_x: 1000
    height_y: 100
    thickness_z: 1000

process:
  hotwire:
    wire_mode: line_hotwire
    wire_count: 1
    effective_kerf_mm: 1.5
    lead_in_mm: 20
    lead_out_mm: 20
    min_segment_mm: 5
    min_radius_mm: 2
  feed:
    xy_mm_min: 500
    slow_curve_mm_min: 250

cut:
  template: tp40_core
  origin: lower_left
  cut_plane: XY
  safe_margin_mm: 10
  compensation: centerline
  avoid_duplicate_cuts: true
  template_params:
    # NOMINAIS de mercado (passo ~195-204, crista 30-35, vale 95-115). NAO sao da sua telha.
    # Medir a telha real com paquimetro, preencher e so entao marcar profile_confirmed: true.
    profile_confirmed: false
    profile_height_mm: 40
    pitch_mm: 200
    crest_width_mm: 35
    valley_width_mm: 105
    n_waves: 5
    panel_width_mm: 1000
    min_thickness_mm: 30
    cut_mode: wavy_line
    # Para compensar o fio: cut.compensation=thermal_kerf_offset_applied e kerf_keep: core|complement

outputs:
  dxf: true
  svg_preview: true
  pdf_job: true
  manifest: true
  gcode:
    enabled: false
