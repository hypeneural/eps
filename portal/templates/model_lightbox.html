{% from "icons.html" import icon %}
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-label" hidden><div class="media-heading"><span id="lightbox-label" aria-live="polite"></span><div class="lightbox-actions"><button class="icon-button" type="button" id="lightbox-full" aria-label="Tela cheia" hidden>{{ icon('full') }}</button><button class="icon-button" type="button" id="lightbox-close" aria-label="Fechar imagem">{{ icon('close') }}</button></div></div><div class="lightbox-body"><button class="icon-button" type="button" id="lightbox-prev" aria-label="Imagem anterior">{{ icon('left') }}</button><img id="lightbox-image" alt=""><button class="icon-button" type="button" id="lightbox-next" aria-label="Próxima imagem">{{ icon('right') }}</button></div><p>Use as setas para navegar ou Esc para fechar.</p></div>
